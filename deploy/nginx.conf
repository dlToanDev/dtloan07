# Copy lên VPS: /etc/nginx/sites-available/blog
# Thay yourdomain.com bằng domain thật TRƯỚC KHI chạy certbot.
#
#   sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com --redirect
#
# Certbot sẽ tự thêm block listen 443 + chứng chỉ vào file này.

# Khai báo zone rate limit — đặt trong http{} của /etc/nginx/nginx.conf,
# KHÔNG đặt ở đây (server block không nhận limit_req_zone):
#   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 10M;

    # Không lộ phiên bản Nginx trong header và trang lỗi.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/rss+xml
        image/svg+xml;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    # --- Asset build của Next: tên file có hash -> cache vĩnh viễn an toàn ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- Ảnh do next/image tối ưu ---
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # --- Endpoint nhạy cảm: siết rate limit ---
    location ~ ^/api/(auth|subscribe|checkout) {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:3000;
    }

    # --- Webhook thanh toán: KHÔNG rate limit ---
    # Cổng thanh toán gửi lại nhiều lần khi retry; chặn ở đây đồng nghĩa
    # với việc khách trả tiền rồi mà không được cấp hàng.
    location /api/webhooks/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Chặn truy cập file ẩn (.env, .git...) nếu lỡ có ai đặt nhầm vào webroot.
    location ~ /\. {
        deny all;
    }
}
