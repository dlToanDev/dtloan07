<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="btn-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="glow-1" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg-grad-1)" rx="24" />
  <rect width="1200" height="480" fill="url(#glow-1)" rx="24" />
  <rect width="1200" height="480" fill="url(#glow-2)" rx="24" />

  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 75)">
    <!-- Top Sponsor Badge -->
    <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">ĐỐI TÁC DEV OPS HÀNG ĐẦU</text>

    <!-- Main Headline -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Vietnix Cloud Server NVMe
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#accent-grad-1)" letter-spacing="-0.5">
      Tối Ưu Hoá Cho Docker &amp; Nginx
    </text>

    <!-- Description -->
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
      Hạ tầng máy chủ ảo hiệu năng cao, ổ cứng Enterprise NVMe siêu tốc.
    </text>
    <text x="0" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
      Bảo vệ Anti-DDoS độc quyền, băng thông không giới hạn, hỗ trợ 24/7.
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 248)">
      <rect width="130" height="28" rx="8" fill="#1e293b" />
      <text x="14" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ 100% NVMe SSD</text>

      <rect x="142" width="135" height="28" rx="8" fill="#1e293b" />
      <text x="156" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🛡️ Anti-DDoS Shield</text>

      <rect x="289" width="125" height="28" rx="8" fill="#1e293b" />
      <text x="303" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🚀 10Gbps Network</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 305)">
      <rect width="210" height="48" rx="14" fill="url(#btn-grad-1)" filter="url(#shadow-1)" />
      <text x="30" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Khám Phá Dịch Vụ ➔</text>
      <text x="235" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">Ưu đãi giảm 40% trọn đời</text>
    </g>
  </g>

  <!-- Right Visual Illustration (Server Tower & Cloud Graphic) -->
  <g transform="translate(780, 80)">
    <!-- Outer Glow Frame -->
    <rect x="0" y="0" width="340" height="320" rx="24" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" filter="url(#shadow-1)" />

    <!-- Server Rack Representation -->
    <g transform="translate(30, 35)">
      <!-- Server Node 1 -->
      <rect x="0" y="0" width="280" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="32" r="5" fill="#10b981" />
      <circle cx="45" cy="32" r="5" fill="#38bdf8" />
      <text x="70" y="37" font-family="monospace" font-size="14" font-weight="700" fill="#e2e8f0">SRV-NODE-01 [PROD]</text>
      <text x="210" y="37" font-family="monospace" font-size="12" fill="#10b981">● ONLINE</text>

      <!-- Server Node 2 -->
      <rect x="0" y="80" width="280" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="112" r="5" fill="#10b981" />
      <circle cx="45" cy="112" r="5" fill="#a855f7" />
      <text x="70" y="117" font-family="monospace" font-size="14" font-weight="700" fill="#e2e8f0">NGINX-EDGE-CLUSTER</text>
      <text x="210" y="117" font-family="monospace" font-size="12" fill="#10b981">● ACTIVE</text>

      <!-- Server Node 3 -->
      <rect x="0" y="160" width="280" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="192" r="5" fill="#10b981" />
      <circle cx="45" cy="192" r="5" fill="#f59e0b" />
      <text x="70" y="197" font-family="monospace" font-size="14" font-weight="700" fill="#e2e8f0">DOCKER-HOST-NVME</text>
      <text x="210" y="197" font-family="monospace" font-size="12" fill="#10b981">● READY</text>
    </g>

    <text x="170" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">
      SỐ 1 VỀ HẠ TẦNG VPS DOANH NGHIỆP
    </text>
  </g>
</svg>
