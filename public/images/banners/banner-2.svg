<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accent-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="btn-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="glow-vultr" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg-grad-2)" rx="24" />
  <rect width="1200" height="480" fill="url(#glow-vultr)" rx="24" />

  <!-- Subtle Network Nodes / Polygons -->
  <g stroke="#14b8a6" stroke-opacity="0.12" stroke-width="1.2">
    <circle cx="850" cy="140" r="6" fill="#14b8a6" />
    <circle cx="1020" cy="180" r="5" fill="#38bdf8" />
    <circle cx="940" cy="300" r="7" fill="#2dd4bf" />
    <circle cx="810" cy="360" r="5" fill="#34d399" />
    <circle cx="1100" cy="330" r="6" fill="#10b981" />
    <line x1="850" y1="140" x2="1020" y2="180" />
    <line x1="1020" y1="180" x2="940" y2="300" />
    <line x1="940" y1="300" x2="810" y2="360" />
    <line x1="940" y1="300" x2="1100" y2="330" />
    <line x1="850" y1="140" x2="940" y2="300" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 75)">
    <!-- Top Sponsor Badge -->
    <rect width="240" height="34" rx="17" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="4" fill="#2dd4bf" />
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" letter-spacing="1">ĐỐI TÁC CLOUD TOÀN CẦU</text>

    <!-- Main Headline -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Vultr Cloud Compute
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#accent-grad-2)" letter-spacing="-0.5">
      Tặng Ngay $100 Credit Dùng Thử
    </text>

    <!-- Description -->
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
      Khởi tạo VPS Linux, Docker, PostgreSQL và Redis chỉ trong 60 giây.
    </text>
    <text x="0" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
      Hơn 32 Data Center trên toàn thế giới với tốc độ mạng cực thấp đến Việt Nam.
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 248)">
      <rect width="145" height="28" rx="8" fill="#1e293b" />
      <text x="14" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🌍 32+ Datacenters</text>

      <rect x="157" width="135" height="28" rx="8" fill="#1e293b" />
      <text x="171" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">💳 $100 Miễn phí</text>

      <rect x="304" width="130" height="28" rx="8" fill="#1e293b" />
      <text x="318" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ 1-Click Docker</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 305)">
      <rect width="215" height="48" rx="14" fill="url(#btn-grad-2)" filter="url(#shadow-2)" />
      <text x="28" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Nhận $100 Credit Ngay ➔</text>
      <text x="245" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#2dd4bf">Dành riêng cho độc giả dltoan07</text>
    </g>
  </g>

  <!-- Right Visual Card (Global Network Map Icon) -->
  <g transform="translate(790, 80)">
    <rect x="0" y="0" width="330" height="320" rx="24" fill="#0f172a" fill-opacity="0.85" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.3" filter="url(#shadow-2)" />
    
    <g transform="translate(25, 30)">
      <rect width="280" height="85" rx="14" fill="#132e29" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2dd4bf">PROMO CODE: VULTR100</text>
      <text x="20" y="65" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff">$100 FREE CREDIT</text>

      <!-- Specifications box -->
      <g transform="translate(0, 105)">
        <rect width="280" height="135" rx="14" fill="#1e293b" />
        <text x="20" y="35" font-family="monospace" font-size="13" fill="#94a3b8">CPU: AMD EPYC 3.4GHz</text>
        <text x="20" y="65" font-family="monospace" font-size="13" fill="#94a3b8">RAM: 4GB DDR4 High-Freq</text>
        <text x="20" y="95" font-family="monospace" font-size="13" fill="#94a3b8">DISK: 80GB NVMe Storage</text>
        <text x="20" y="122" font-family="monospace" font-size="13" fill="#2dd4bf">BANDWIDTH: 3TB / Month</text>
      </g>
    </g>
  </g>
</svg>
