<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="50%" stop-color="#0f1f38" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="200" r="180" fill="#0284c7" opacity="0.2" filter="url(#glow)" />
  <circle cx="250" cy="450" r="150" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Left Side: Content -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <rect width="100" height="34" rx="17" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="50" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">DEVOPS</text>

    <!-- Tag Pills -->
    <rect x="115" y="0" width="85" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="157" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#docker</text>
    <rect x="210" y="0" width="105" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="262" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#postgres</text>
    <rect x="325" y="0" width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="365" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#prisma</text>

    <!-- Title -->
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Dựng PostgreSQL cho dev</tspan>
      <tspan x="0" dy="58">bằng Docker Compose</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Cách config persistent volume, pg_isready healthcheck</tspan>
      <tspan x="0" dy="32">và kết nối Prisma không lo xung đột môi trường máy.</tspan>
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 325)">
      <circle cx="12" cy="12" r="8" fill="#38bdf8" />
      <text x="32" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Volume Persistence</text>

      <circle cx="232" cy="12" r="8" fill="#818cf8" />
      <text x="252" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">pg_isready Check</text>

      <circle cx="432" cy="12" r="8" fill="#34d399" />
      <text x="452" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Zero Host Pollution</text>
    </g>
  </g>

  <!-- Right Side: Docker & YAML Mockup -->
  <g transform="translate(680, 110)">
    <rect width="440" height="400" rx="16" fill="#081020" stroke="#1e3a5f" stroke-width="2" />
    <rect width="440" height="42" rx="16" fill="#152846" />
    <rect y="26" width="440" height="16" fill="#152846" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="220" y="26" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">docker-compose.yml</text>

    <g transform="translate(24, 68)" font-family="Consolas, Monaco, monospace" font-size="13" fill="#e2e8f0">
      <text y="20"><tspan fill="#38bdf8">services</tspan>:</text>
      <text y="44">  <tspan fill="#60a5fa">postgres</tspan>:</text>
      <text y="68">    <tspan fill="#94a3b8">image</tspan>: <tspan fill="#34d399">postgres:16-alpine</tspan></text>
      <text y="92">    <tspan fill="#94a3b8">ports</tspan>: [<tspan fill="#f59e0b">"5432:5432"</tspan>]</text>
      <text y="120">    <tspan fill="#94a3b8">environment</tspan>:</text>
      <text y="144">      <tspan fill="#cbd5e1">POSTGRES_DB: blog_db</tspan></text>
      <text y="168">    <tspan fill="#94a3b8">volumes</tspan>:</text>
      <text y="192">      - <tspan fill="#38bdf8">postgres_data</tspan>:/var/lib/postgresql</text>
      <text y="222">    <tspan fill="#94a3b8">healthcheck</tspan>:</text>
      <text y="246">      <tspan fill="#cbd5e1">test: pg_isready -U user</tspan></text>
      <text y="270">      <tspan fill="#cbd5e1">interval: 5s, retries: 5</tspan></text>
    </g>

    <!-- Floating status indicator -->
    <g transform="translate(220, 335)">
      <rect width="200" height="46" rx="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="22" cy="23" r="6" fill="#38bdf8" />
      <text x="36" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">STATUS: HEALTHY (healthy)</text>
    </g>
  </g>
</svg>
