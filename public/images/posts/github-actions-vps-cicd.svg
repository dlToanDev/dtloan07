<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1538" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="950" cy="200" r="180" fill="#22c55e" opacity="0.15" filter="url(#glow)" />
  <circle cx="250" cy="450" r="150" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <g transform="translate(80, 100)">
    <rect width="100" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="50" y="22" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">DEVOPS</text>

    <rect x="115" y="0" width="75" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="152" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#cicd</text>
    <rect x="200" y="0" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="265" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#github-actions</text>
    <rect x="340" y="0" width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="380" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#docker</text>

    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Tự động deploy lên VPS</tspan>
      <tspan x="0" dy="58">với GitHub Actions &amp; Docker</tspan>
    </text>

    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Thiết lập pipeline CI/CD zero-downtime, build image đa kiến trúc</tspan>
      <tspan x="0" dy="32">và trigger deploy an toàn qua SSH key mã hóa.</tspan>
    </text>

    <g transform="translate(0, 325)">
      <circle cx="12" cy="12" r="8" fill="#22c55e" />
      <text x="32" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Zero-Downtime Rollout</text>

      <circle cx="232" cy="12" r="8" fill="#38bdf8" />
      <text x="252" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Multi-Arch Buildx</text>

      <circle cx="432" cy="12" r="8" fill="#a78bfa" />
      <text x="452" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Encrypted SSH Vault</text>
    </g>
  </g>

  <!-- Right Side: Pipeline Stages -->
  <g transform="translate(680, 110)">
    <rect width="440" height="400" rx="16" fill="#0c101d" stroke="#1f293d" stroke-width="2" />
    <rect width="440" height="42" rx="16" fill="#182238" />
    <rect y="26" width="440" height="16" fill="#182238" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="220" y="26" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">.github/workflows/deploy.yml</text>

    <!-- Pipeline steps mockup -->
    <g transform="translate(24, 60)">
      <!-- Step 1 -->
      <rect y="0" width="392" height="56" rx="8" fill="#131d33" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="28" cy="28" r="10" fill="#22c55e" fill-opacity="0.2" />
      <circle cx="28" cy="28" r="5" fill="#22c55e" />
      <text x="52" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Run Lint &amp; Vitest Suite</text>
      <text x="52" y="44" fill="#94a3b8" font-family="monospace" font-size="11">passed in 28s</text>

      <!-- Step 2 -->
      <rect y="70" width="392" height="56" rx="8" fill="#131d33" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="28" cy="98" r="10" fill="#22c55e" fill-opacity="0.2" />
      <circle cx="28" cy="98" r="5" fill="#22c55e" />
      <text x="52" y="96" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Docker Build &amp; Push to Registry</text>
      <text x="52" y="114" fill="#94a3b8" font-family="monospace" font-size="11">ghcr.io/app:v1.2.0 (amd64/arm64)</text>

      <!-- Step 3 -->
      <rect y="140" width="392" height="56" rx="8" fill="#131d33" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="28" cy="168" r="10" fill="#22c55e" fill-opacity="0.2" />
      <circle cx="28" cy="168" r="5" fill="#22c55e" />
      <text x="52" y="166" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">SSH Deploy to Remote VPS</text>
      <text x="52" y="184" fill="#94a3b8" font-family="monospace" font-size="11">docker compose pull &amp;&amp; up -d</text>
    </g>

    <g transform="translate(200, 335)">
      <rect width="220" height="46" rx="10" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="22" cy="23" r="6" fill="#22c55e" />
      <text x="36" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">PIPELINE SUCCEEDED (1m 45s)</text>
    </g>
  </g>
</svg>
