<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#181824" />
      <stop offset="100%" stop-color="#2c150c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="950" cy="200" r="180" fill="#f97316" opacity="0.2" filter="url(#glow)" />
  <circle cx="250" cy="450" r="150" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />

  <g transform="translate(80, 100)">
    <rect width="160" height="34" rx="17" fill="#f97316" fill-opacity="0.18" stroke="#fb923c" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="80" y="22" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">QUẢN TRỊ SERVER</text>

    <rect x="175" y="0" width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="215" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#server</text>
    <rect x="265" y="0" width="115" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="322" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#prometheus</text>
    <rect x="390" y="0" width="85" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="432" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#grafana</text>

    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Giám sát tài nguyên VPS</tspan>
      <tspan x="0" dy="58">với Prometheus &amp; Grafana</tspan>
    </text>

    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Thu thập metrics Node Exporter, cảnh báo Telegram</tspan>
      <tspan x="0" dy="32">và dựng dashboard theo dõi CPU, RAM, Disk thời gian thực.</tspan>
    </text>

    <g transform="translate(0, 325)">
      <circle cx="12" cy="12" r="8" fill="#f97316" />
      <text x="32" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Realtime Metrics</text>

      <circle cx="212" cy="12" r="8" fill="#eab308" />
      <text x="232" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Telegram Alerts</text>

      <circle cx="412" cy="12" r="8" fill="#34d399" />
      <text x="432" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Custom Dashboards</text>
    </g>
  </g>

  <!-- Right Side: Dashboard Graph Mockup -->
  <g transform="translate(680, 110)">
    <rect width="440" height="400" rx="16" fill="#0d111a" stroke="#2a1e17" stroke-width="2" />
    <rect width="440" height="42" rx="16" fill="#1e181e" />
    <rect y="26" width="440" height="16" fill="#1e181e" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="220" y="26" fill="#fdba74" font-family="monospace" font-size="13" text-anchor="middle">Grafana — Linux Node Overview</text>

    <!-- Chart 1: CPU Usage -->
    <g transform="translate(24, 60)">
      <rect width="392" height="110" rx="8" fill="#161522" stroke="#33241d" />
      <text x="16" y="24" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CPU UTILIZATION (4 CORES)</text>
      <text x="320" y="24" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">18.4%</text>
      <!-- Wave Path -->
      <path d="M 16 85 Q 60 70, 100 80 T 180 50 T 260 65 T 340 40 T 376 48" fill="none" stroke="#f97316" stroke-width="2.5" />
    </g>

    <!-- Chart 2: RAM & Disk -->
    <g transform="translate(24, 185)">
      <rect width="392" height="110" rx="8" fill="#161522" stroke="#33241d" />
      <text x="16" y="24" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RAM USAGE (2.4 GB / 8.0 GB)</text>
      <text x="320" y="24" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">30.0%</text>
      <!-- Wave Path -->
      <path d="M 16 80 Q 70 85, 120 75 T 200 70 T 280 60 T 360 62 T 376 58" fill="none" stroke="#eab308" stroke-width="2.5" />
    </g>

    <g transform="translate(210, 335)">
      <rect width="210" height="46" rx="10" fill="#f97316" fill-opacity="0.25" stroke="#f97316" stroke-width="1.5" />
      <circle cx="22" cy="23" r="6" fill="#34d399" />
      <text x="36" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ALERTMANAGER: NORMAL</text>
    </g>
  </g>
</svg>
