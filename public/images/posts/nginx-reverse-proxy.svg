<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="180" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="480" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Left Side: Header & Text -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <rect width="160" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="80" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">QUẢN TRỊ SERVER</text>

    <!-- Tag Pills -->
    <rect x="175" y="0" width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="215" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#nginx</text>
    <rect x="265" y="0" width="70" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="300" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#vps</text>

    <!-- Title -->
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Tối ưu Nginx Reverse Proxy</tspan>
      <tspan x="0" dy="58">cho Next.js trên VPS</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Cấu hình cache asset tĩnh, nén gzip, rate limit</tspan>
      <tspan x="0" dy="32">và xử lý 502/504 Bad Gateway triệt để.</tspan>
    </text>

    <!-- Feature highlights -->
    <g transform="translate(0, 325)">
      <!-- Item 1 -->
      <circle cx="12" cy="12" r="8" fill="#10b981" />
      <text x="32" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Proxy Cache 365d</text>

      <!-- Item 2 -->
      <circle cx="212" cy="12" r="8" fill="#06b6d4" />
      <text x="232" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Gzip &amp; Brotli</text>

      <!-- Item 3 -->
      <circle cx="392" cy="12" r="8" fill="#38bdf8" />
      <text x="412" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">SSL A+ Grade</text>
    </g>
  </g>

  <!-- Right Side: Architecture / Terminal Mockup -->
  <g transform="translate(680, 110)">
    <!-- Terminal Window Container -->
    <rect width="440" height="400" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
    
    <!-- Top bar -->
    <rect width="440" height="42" rx="16" fill="#1e293b" />
    <rect y="26" width="440" height="16" fill="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="220" y="26" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">nginx.conf — /etc/nginx</text>

    <!-- Code Preview inside Window -->
    <g transform="translate(24, 68)" font-family="Consolas, Monaco, monospace" font-size="13" fill="#e2e8f0">
      <text y="20"><tspan fill="#38bdf8">upstream</tspan> nextjs_upstream {</text>
      <text y="44">    <tspan fill="#10b981">server</tspan> 127.0.0.1:3000;</text>
      <text y="68">    <tspan fill="#94a3b8">keepalive</tspan> 64;</text>
      <text y="92">}</text>

      <text y="126"><tspan fill="#38bdf8">server</tspan> {</text>
      <text y="150">    <tspan fill="#10b981">listen</tspan> 443 ssl http2;</text>
      <text y="174">    <tspan fill="#94a3b8">server_name</tspan> example.com;</text>
      <text y="208">    <tspan fill="#38bdf8">location</tspan> /_next/static/ {</text>
      <text y="232">        <tspan fill="#10b981">proxy_cache</tspan> STATIC;</text>
      <text y="256">        <tspan fill="#f59e0b">add_header</tspan> Cache-Control</text>
      <text y="280">          <tspan fill="#34d399">"public, max-age=31536000"</tspan>;</text>
      <text y="304">    }</text>
      <text y="328">}</text>
    </g>

    <!-- Floating Badge -->
    <g transform="translate(260, 335)">
      <rect width="160" height="46" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
      <circle cx="24" cy="23" r="6" fill="#10b981" />
      <text x="38" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">200 OK • CACHED</text>
    </g>
  </g>
</svg>
