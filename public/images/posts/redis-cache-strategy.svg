<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080a" />
      <stop offset="50%" stop-color="#240c11" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="950" cy="200" r="180" fill="#dc2626" opacity="0.2" filter="url(#glow)" />
  <circle cx="250" cy="450" r="150" fill="#ea580c" opacity="0.15" filter="url(#glow)" />

  <g transform="translate(80, 100)">
    <rect width="110" height="34" rx="17" fill="#dc2626" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="55" y="22" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">DATABASE</text>

    <rect x="125" y="0" width="75" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="162" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#redis</text>
    <rect x="210" y="0" width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="250" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#nextjs</text>
    <rect x="300" y="0" width="85" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="342" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#caching</text>

    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Chiến lược Cache đa tầng</tspan>
      <tspan x="0" dy="58">với Redis và Next.js</tspan>
    </text>

    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Xử lý Cache Stampede, chống nghẽn DB và</tspan>
      <tspan x="0" dy="32">thiết lập cơ chế Invalidation realtime chuẩn chỉnh.</tspan>
    </text>

    <g transform="translate(0, 325)">
      <circle cx="12" cy="12" r="8" fill="#ef4444" />
      <text x="32" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Sub-1ms Latency</text>

      <circle cx="212" cy="12" r="8" fill="#f97316" />
      <text x="232" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Cache Stampede Lock</text>

      <circle cx="432" cy="12" r="8" fill="#34d399" />
      <text x="452" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">99.4% Hit Rate</text>
    </g>
  </g>

  <g transform="translate(680, 110)">
    <rect width="440" height="400" rx="16" fill="#140a0e" stroke="#3d141d" stroke-width="2" />
    <rect width="440" height="42" rx="16" fill="#2d121b" />
    <rect y="26" width="440" height="16" fill="#2d121b" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="220" y="26" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">lib/redis-cache.ts</text>

    <g transform="translate(24, 68)" font-family="Consolas, Monaco, monospace" font-size="13" fill="#e2e8f0">
      <text y="20"><tspan fill="#f87171">export async function</tspan> getCached&lt;T&gt;(</text>
      <text y="44">  key: <tspan fill="#60a5fa">string</tspan>, fetcher: () =&gt; Promise&lt;T&gt;,</text>
      <text y="68">  ttlSeconds: <tspan fill="#f59e0b">300</tspan></text>
      <text y="92">): Promise&lt;T&gt; {</text>
      <text y="122">  <tspan fill="#c4b5fd">const</tspan> hit = <tspan fill="#f87171">await</tspan> redis.get(key);</text>
      <text y="150">  <tspan fill="#f43f5e">if</tspan> (hit) <tspan fill="#f43f5e">return</tspan> JSON.parse(hit);</text>
      <text y="190">  <tspan fill="#64748b">// Lock against stampede</tspan></text>
      <text y="214">  <tspan fill="#c4b5fd">const</tspan> fresh = <tspan fill="#f87171">await</tspan> fetcher();</text>
      <text y="240">  <tspan fill="#f87171">await</tspan> redis.setex(key, ttl, fresh);</text>
      <text y="270">  <tspan fill="#f43f5e">return</tspan> fresh;</text>
      <text y="300">}</text>
    </g>

    <g transform="translate(220, 335)">
      <rect width="200" height="46" rx="10" fill="#dc2626" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="22" cy="23" r="6" fill="#ef4444" />
      <text x="36" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">CACHE HIT • 0.4ms</text>
    </g>
  </g>
</svg>
