<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a1a" />
      <stop offset="50%" stop-color="#181336" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="950" cy="200" r="180" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />
  <circle cx="250" cy="450" r="150" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <g transform="translate(80, 100)">
    <rect width="120" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="60" y="22" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">LẬP TRÌNH</text>

    <rect x="135" y="0" width="105" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="187" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#typescript</text>
    <rect x="250" y="0" width="65" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="282" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#zod</text>
    <rect x="325" y="0" width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="365" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">#nextjs</text>

    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Validate biến môi trường</tspan>
      <tspan x="0" dy="58">bằng Zod lúc khởi động</tspan>
    </text>

    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Tránh lỗi runtime bí ẩn ở luồng thanh toán.</tspan>
      <tspan x="0" dy="32">Bắt app fail-fast ngay lúc boot kèm type-safe 100%.</tspan>
    </text>

    <g transform="translate(0, 325)">
      <circle cx="12" cy="12" r="8" fill="#a78bfa" />
      <text x="32" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Fail-Fast on Boot</text>

      <circle cx="212" cy="12" r="8" fill="#38bdf8" />
      <text x="232" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Strict TypeScript Types</text>

      <circle cx="432" cy="12" r="8" fill="#34d399" />
      <text x="452" y="17" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Zero Crash in Prod</text>
    </g>
  </g>

  <!-- Right Side: Code Mockup -->
  <g transform="translate(680, 110)">
    <rect width="440" height="400" rx="16" fill="#0d0e22" stroke="#2a2356" stroke-width="2" />
    <rect width="440" height="42" rx="16" fill="#1c1942" />
    <rect y="26" width="440" height="16" fill="#1c1942" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="220" y="26" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">src/config/env.ts</text>

    <g transform="translate(24, 68)" font-family="Consolas, Monaco, monospace" font-size="13" fill="#e2e8f0">
      <text y="20"><tspan fill="#c4b5fd">const</tspan> serverSchema = <tspan fill="#60a5fa">z.object</tspan>({</text>
      <text y="44">  <tspan fill="#93c5fd">NODE_ENV</tspan>: z.enum([...]),</text>
      <text y="68">  <tspan fill="#93c5fd">DATABASE_URL</tspan>: z.string().url(),</text>
      <text y="92">  <tspan fill="#93c5fd">AUTH_SECRET</tspan>: z.string().min(32),</text>
      <text y="116">});</text>
      <text y="150"><tspan fill="#c4b5fd">const</tspan> parsed =</text>
      <text y="174">  serverSchema.safeParse(process.env);</text>
      <text y="210"><tspan fill="#f43f5e">if</tspan> (!parsed.success) {</text>
      <text y="234">  <tspan fill="#f43f5e">throw new Error</tspan>(</text>
      <text y="258">    `❌ Biến môi trường không hợp lệ`</text>
      <text y="282">  );</text>
      <text y="306">}</text>
    </g>

    <g transform="translate(220, 335)">
      <rect width="200" height="46" rx="10" fill="#8b5cf6" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1.5" />
      <circle cx="22" cy="23" r="6" fill="#34d399" />
      <text x="36" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">100% TYPE-SAFE BOOT</text>
    </g>
  </g>
</svg>
