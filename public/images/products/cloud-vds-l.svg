<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg-cloud-vds-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>
    <radialGradient id="radial-cloud-vds-l" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-cloud-vds-l">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-cloud-vds-l)" />
  <rect width="800" height="500" fill="url(#radial-cloud-vds-l)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Server Card Container -->
  <rect x="60" y="50" width="680" height="400" rx="24" fill="#0b1120" fill-opacity="0.82" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity="0.7" filter="url(#shadow-cloud-vds-l)" />

  <!-- Top Badge -->
  <rect x="90" y="80" width="165" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
  <text x="172" y="101" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">VDS NÂNG CAO</text>

  <!-- Brand Subtitle -->
  <text x="535" y="101" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Virtual Dedicated Server (VDS)</text>

  <!-- Product Title -->
  <text x="90" y="165" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">Cloud VDS L</text>

  <!-- Price Tag -->
  <g transform="translate(90, 185)">
    <text x="0" y="32" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">3.191.000đ/tháng</text>
    <text x="310" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Kỳ hạn 12 tháng</text>
  </g>

  <!-- Specs Grid -->
  <g transform="translate(90, 255)">
    <!-- Box 1: CPU -->
    <rect x="0" y="0" width="155" height="80" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="18" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">PHYSICAL CPU</text>
    <text x="18" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold">6 Physical Cores</text>
    <text x="18" y="68" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">AMD EPYC 7282</text>

    <!-- Box 2: RAM -->
    <rect x="170" y="0" width="135" height="80" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="188" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">RAM</text>
    <text x="188" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold">48 GB RAM</text>
    <text x="188" y="68" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10">ECC Dedicated</text>

    <!-- Box 3: Storage -->
    <rect x="320" y="0" width="145" height="80" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="338" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">NVME STORAGE</text>
    <text x="338" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold">360 GB NVMe</text>
    <text x="338" y="68" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10">+ Mở rộng thêm</text>

    <!-- Box 4: Network -->
    <rect x="480" y="0" width="140" height="80" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="498" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">PORT NETWORK</text>
    <text x="498" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold">750 Mbit/s Port</text>
    <text x="498" y="68" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10">Không giới hạn</text>
  </g>

  <!-- Bottom Features Strip -->
  <g transform="translate(90, 375)">
    <text x="0" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✓ Tài nguyên vật lý riêng biệt 100%</text>
    <text x="270" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✓ Không chia sẻ CPU</text>
    <text x="480" y="24" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">🛡️ Tự giao qua Zalo/Tele</text>
  </g>
</svg>