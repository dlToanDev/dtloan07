<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg-cloud-vps-60" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow-cloud-vps-60" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="radial-cloud-vps-60" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-cloud-vps-60">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-cloud-vps-60)" />
  <rect width="800" height="500" fill="url(#radial-cloud-vps-60)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Server Card Container -->
  <rect x="60" y="50" width="680" height="400" rx="24" fill="#0f172a" fill-opacity="0.75" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow-cloud-vps-60)" />

  <!-- Top Badge -->
  <rect x="90" y="80" width="160" height="32" rx="16" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" />
  <text x="170" y="101" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">MAX PERFORMANCE</text>

  <!-- Brand Subtitle -->
  <text x="560" y="101" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">EonCloudvn • High Performance</text>

  <!-- Product Title -->
  <text x="90" y="165" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">Cloud VPS 60</text>

  <!-- Price Tag -->
  <g transform="translate(90, 185)">
    <text x="0" y="32" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">1.919.000đ/tháng</text>
    <text x="260" y="30" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-decoration="line-through">2.399.000đ</text>
  </g>

  <!-- Specs Grid -->
  <g transform="translate(90, 260)">
    <!-- Box 1: CPU -->
    <rect x="0" y="0" width="140" height="75" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">vCPU</text>
    <text x="20" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold">18 vCPU Cores</text>

    <!-- Box 2: RAM -->
    <rect x="155" y="0" width="140" height="75" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="175" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">RAM</text>
    <text x="175" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold">96 GB RAM</text>

    <!-- Box 3: Storage -->
    <rect x="310" y="0" width="140" height="75" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="330" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">STORAGE</text>
    <text x="330" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold">300 GB NVMe</text>

    <!-- Box 4: Network -->
    <rect x="465" y="0" width="155" height="75" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="485" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">NETWORK</text>
    <text x="485" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold">1 Gbit/s Port</text>
  </g>

  <!-- Bottom Features Strip -->
  <g transform="translate(90, 375)">
    <text x="0" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✓ Miễn phí khởi tạo</text>
    <text x="150" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✓ Băng thông không giới hạn</text>
    <text x="360" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✓ Bàn giao nhanh 24/7</text>
    <text x="530" y="24" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">🛡️ Tự giao qua Zalo/Tele</text>
  </g>
</svg>